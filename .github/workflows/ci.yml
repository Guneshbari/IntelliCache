name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    name: Frontend Quality (Lint, Format, Types)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Run code linter (ESLint)
        run: pnpm lint

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Build frontend application
        run: pnpm build

  frontend-tests-and-build:
    name: Frontend Tests & Application Build
    needs: frontend-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest unit & integration test suite
        run: pnpm test

      - name: Build frontend application
        run: pnpm build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: intellicache-frontend-build
          path: dist/
          retention-days: 14

  gateway-unit-tests:
    name: Gateway Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'gateway/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements.txt

      - name: Validate Python syntax and compilation
        run: python -m compileall gateway/app gateway/tests

      - name: Run gateway unit test suite
        working-directory: gateway
        run: python -m unittest discover tests

      - name: Verify Stage 3.1.1 semantic cache evaluation dataset integrity and zero-FP gate
        working-directory: gateway
        run: |
          python scripts/evaluate_semantic_cache.py --dataset evaluation/dataset_stage3_1_1.json --split development --provider mock --fail-on-fp
          python scripts/evaluate_semantic_cache.py --dataset evaluation/dataset_stage3_1_1.json --split test --provider mock --fail-on-fp

  gateway-postgres-integration:
    name: Gateway PostgreSQL & pgvector Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellicache_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            gateway/requirements.txt
            gateway/requirements-fastembed.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements.txt
          pip install -r gateway/requirements-fastembed.txt

      - name: Verify PostgreSQL & pgvector service health
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL service container..."
            sleep 2
          done

      - name: Run PostgreSQL Integration Tests
        working-directory: gateway
        env:
          TEST_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/intellicache_test'
        run: |
          python -m unittest tests.test_multi_client tests.test_vector_store tests.test_semantic_cache tests.test_conversations

      - name: Run Full Gateway Regression Suite with Live PostgreSQL
        working-directory: gateway
        env:
          TEST_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/intellicache_test'
        run: python -m unittest discover tests

  gateway-fastembed-real-inference:
    name: Gateway Real FastEmbed & pgvector (384-d) Verification
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intellicache_fastembed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            gateway/requirements.txt
            gateway/requirements-fastembed.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r gateway/requirements.txt
          pip install -r gateway/requirements-fastembed.txt

      - name: Cache FastEmbed model artifacts
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5-${{ runner.os }}
          restore-keys: |
            fastembed-bge-small-en-v1.5-

      - name: Verify PostgreSQL & pgvector service health
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL service container..."
            sleep 2
          done

      - name: Run unmocked FastEmbed smoke tests and batch benchmarks
        working-directory: gateway
        env:
          RUN_FASTEMBED_SMOKE: '1'
        run: |
          python -m unittest -v tests.test_fastembed_smoke

      - name: Run real FastEmbed + pgvector 384-dimensional integration tests
        working-directory: gateway
        env:
          RUN_FASTEMBED_PGVECTOR_TEST: '1'
          REQUIRE_FASTEMBED_PGVECTOR_TEST: '1'
          TEST_DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/intellicache_fastembed_test'
        run: |
          python -m unittest -v tests.test_evaluation.TestRealFastEmbedPgvectorIntegration

      - name: Run Stage 3.2.3 HNSW vs exact retrieval benchmark runner
        working-directory: gateway
        run: |
          python scripts/benchmark_hnsw.py --test-database-url postgresql://postgres:postgres@localhost:5432/intellicache_fastembed_test --total-docs 2000

      - name: Verify real FastEmbed evaluation harness execution
        working-directory: gateway
        run: |
          python scripts/evaluate_semantic_cache.py --dataset evaluation/dataset_stage3_1_1.json --split development --provider fastembed --benchmark-mode component
